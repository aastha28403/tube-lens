<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f10;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 760px;
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .logo svg { width: 26px; height: 26px; }

    #clear-btn {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    #clear-btn:hover { border-color: #555; color: #ccc; }

    #chat-box {
      flex: 1;
      width: 100%;
      max-width: 760px;
      overflow-y: auto;
      padding: 24px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .message {
      display: flex;
      gap: 12px;
      max-width: 100%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .user .avatar  { background: #4f46e5; color: #fff; }
    .bot  .avatar  { background: #1e293b; color: #7dd3fc; border: 1px solid #334155; }

    .bubble {
      flex: 1;
      line-height: 1.65;
      font-size: 0.95rem;
      color: #dde1e7;
      max-width: calc(100% - 44px);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      padding: 10px 14px;
      border-radius: 12px 12px 4px 12px;
      color: #e2e8f0;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #4f46e5;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    #input-area {
      width: 100%;
      max-width: 760px;
      padding: 16px 24px 24px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      background: #18181b;
      border: 1px solid #2a2a2e;
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }
    #input-row:focus-within { border-color: #4f46e5; }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 0.95rem;
      resize: none;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      font-family: inherit;
    }
    #user-input::placeholder { color: #555; }

    #send-btn {
      align-self: flex-end;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover  { background: #4338ca; }
    #send-btn:active { opacity: 0.8; }
    #send-btn svg { width: 16px; height: 16px; fill: #fff; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.4;
      pointer-events: none;
    }
    .empty-state svg { width: 40px; height: 40px; }
    .empty-state p { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="15" fill="#4f46e5" opacity="0.15"/>
      <path d="M16 6 C10 6 6 10 6 16 C6 19 7.5 21.5 10 23 L10 27 L14 24.5 C14.6 24.6 15.3 24.7 16 24.7 C22 24.7 26 20.7 26 16 C26 10 22 6 16 6Z" fill="#4f46e5"/>
      <circle cx="12" cy="16" r="1.5" fill="white"/>
      <circle cx="16" cy="16" r="1.5" fill="white"/>
      <circle cx="20" cy="16" r="1.5" fill="white"/>
    </svg>
    Gemini Chat
  </div>
  <button id="clear-btn">Clear chat</button>
</header>

<div id="chat-box">
  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
    </svg>
    <p>Start a conversation</p>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Ask anything…"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
  const chatBox   = document.getElementById("chat-box");
  const input     = document.getElementById("user-input");
  const sendBtn   = document.getElementById("send-btn");
  const clearBtn  = document.getElementById("clear-btn");
  const emptyState = document.getElementById("empty-state");

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  input.addEventListener("input", autoResize);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener("click", sendMessage);
  clearBtn.addEventListener("click", clearChat);

  function appendMessage(role, text) {
    emptyState.style.display = "none";

    const div = document.createElement("div");
    div.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  function showTyping() {
    emptyState.style.display = "none";
    const div = document.createElement("div");
    div.className = "message bot";
    div.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "AI";

    const indicator = document.createElement("div");
    indicator.className = "typing-indicator";
    indicator.innerHTML = "<span></span><span></span><span></span>";

    div.appendChild(avatar);
    div.appendChild(indicator);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    appendMessage("user", text);
    showTyping();
    sendBtn.disabled = true;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();
      appendMessage("bot", data.reply || data.error || "Something went wrong.");
    } catch {
      removeTyping();
      appendMessage("bot", "Network error. Please try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function clearChat() {
    await fetch("/clear", { method: "POST" });
    const messages = chatBox.querySelectorAll(".message");
    messages.forEach(m => m.remove());
    emptyState.style.display = "flex";
  }
</script>

</body>
</html>
